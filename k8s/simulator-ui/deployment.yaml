apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-ui
  namespace: lakewatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator-ui
  template:
    metadata:
      labels:
        app: simulator-ui
    spec:
      containers:
        - name: simulator-ui
          image: lakewatch-simulator-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: SIMULATOR_URL
              value: "http://simulator:9000"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
