apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: lakewatch
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: lakewatch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: controller
      port: 9093
      targetPort: 9093