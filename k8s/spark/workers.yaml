
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: lakewatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: lakewatch-spark:3.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
          ports:
            - name: web-ui
              containerPort: 8081
          env:
            - name: SPARK_WORKER_CORES
              value: "1"
            - name: SPARK_WORKER_MEMORY
              value: 1g
            - name: SPARK_WORKER_WEBUI_PORT
              value: "8081"
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: data-lake
              mountPath: /data-lake
      volumes:
        - name: data-lake
          persistentVolumeClaim:
            claimName: data-lake
