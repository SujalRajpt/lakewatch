apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: lakewatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: lakewatch-spark:3.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
          ports:
            - name: spark
              containerPort: 7077
            - name: web-ui
              containerPort: 8080
          env:
            - name: SPARK_MASTER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
            - name: SPARK_MASTER_WEBUI_HOST
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: lakewatch
spec:
  selector:
    app: spark-master
  ports:
    - name: spark
      port: 7077
      targetPort: 7077
    - name: web-ui
      port: 8080
      targetPort: 8080
