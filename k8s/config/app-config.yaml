apiVersion: v1
kind: ConfigMap
metadata:
  name: lakewatch-app-config
  namespace: lakewatch
data:
  POSTGRES_DB: "lakewatch"
  POSTGRES_USER: "lakewatch"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  KAFKA_TOPIC: "sensor-readings"
  KAFKA_PARTITIONS: "6"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "lakewatch-reading-processors"
