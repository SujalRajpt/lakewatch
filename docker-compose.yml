  services:

    # ==========================================================
    # DATABASE
    # ==========================================================

    postgres:
      image: postgres:17
      container_name: lakewatch-postgres

      environment:
        POSTGRES_DB: lakewatch
        POSTGRES_USER: lakewatch
        POSTGRES_PASSWORD: lakewatch_password

      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U lakewatch -d lakewatch"]
        interval: 5s
        timeout: 5s
        retries: 10


    # ==========================================================
    # KAFKA BROKER
    # ==========================================================
    kafka:
      image: apache/kafka:4.0.2
      container_name: lakewatch-kafka

      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_NUM_PARTITIONS: 6
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_LOG_DIRS: /var/lib/kafka/data

      volumes:
        - kafka_data:/var/lib/kafka/data

      healthcheck:
        test:
          - CMD-SHELL
          - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
        interval: 10s
        timeout: 10s
        retries: 10
        start_period: 20s

      # Do not restart automatically when Docker starts.
      restart: "no"

    # ==========================================================
    # KAFKA TOPIC INITIALIZATION
    # ==========================================================
    kafka-init:
      image: apache/kafka:4.0.2
      container_name: lakewatch-kafka-init

      depends_on:
        kafka:
          condition: service_healthy

      entrypoint: ["/bin/bash", "-c"]
      command:
        - |
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic sensor-readings \
            --partitions 6 \
            --replication-factor 1

      restart: "no"

    # ==========================================================
    # KAFKA CONSUMER WORKER
    # ==========================================================
    reading-consumer:
      build:
        context: ./backend

      command: ["python", "-m", "app.workers.reading_consumer"]

      env_file:
        - .env

      depends_on:
        postgres:
          condition: service_healthy
        kafka-init:
          condition: service_completed_successfully

      # Do not restart automatically when Docker starts.
      restart: "no"


  # ==========================================================
    # FASTAPI BACKEND
    # ==========================================================

    backend:
      build:
        context: ./backend

      container_name: lakewatch-backend

      ports:
        - "8000:8000"

      env_file:
        - .env

      volumes:
        - ./data-lake:/data-lake:ro

      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
        kafka-init:
          condition: service_completed_successfully


    # ==========================================================
    # SENSOR SIMULATOR
    # ==========================================================

    simulator:
      build:
        context: ./simulator

      container_name: lakewatch-simulator

      ports:
        - "9000:9000"

      env_file:
        - .env

      depends_on:
        backend:
          condition: service_started


    # ==========================================================
    # SIMULATOR CONTROL UI
    # ==========================================================

    simulator-ui:
      build:
        context: ./simulator-ui

      container_name: lakewatch-simulator-ui

      ports:
        - "9001:8501"

      environment:
        SIMULATOR_URL: http://simulator:9000

      depends_on:
        simulator:
          condition: service_started

    # ==========================================================
    # ADMINER
    # ==========================================================

    adminer:
      image: adminer:latest
      container_name: lakewatch-adminer

      ports:
        - "8080:8080"

      depends_on:
        postgres:
          condition: service_healthy
          


    # ==========================================================
    # MAIN FRONTEND
    # ==========================================================

    frontend:
      build:
        context: ./frontend

      container_name: lakewatch-frontend

      ports:
        - "5173:5173"

      volumes:
        - ./frontend:/app
        - /app/node_modules

      environment:
        CHOKIDAR_USEPOLLING: "true"

      depends_on:
        backend:
          condition: service_started




    # ==========================================================
    # one-off Compose job
    # ==========================================================
    data-lake-export:
      build:
        context: ./backend

      profiles: ["data-jobs"]

      command: ["python", "/jobs/data_lake/export_readings.py"]

      env_file:
        - .env

      environment:
        DATA_LAKE_RAW_DIR: /data-lake/raw

      volumes:
        - ./jobs:/jobs
        - ./data-lake:/data-lake

      depends_on:
        postgres:
          condition: service_healthy

      restart: "no"

  # ============================================================
  # VOLUMES
  # ============================================================

  volumes:
    postgres_data:
    kafka_data: