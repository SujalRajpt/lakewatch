services:

  # ==========================================================
  # DATABASE
  # ==========================================================

  postgres:
    image: postgres:17
    container_name: lakewatch-postgres

    environment:
      POSTGRES_DB: lakewatch
      POSTGRES_USER: lakewatch
      POSTGRES_PASSWORD: lakewatch_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakewatch -d lakewatch"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================

  backend:
    build:
      context: ./backend

    container_name: lakewatch-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy


  # ==========================================================
  # SENSOR SIMULATOR
  # ==========================================================

  simulator:
    build:
      context: ./simulator

    container_name: lakewatch-simulator

    ports:
      - "9000:9000"

    env_file:
      - .env

    depends_on:
      backend:
        condition: service_started


  # ==========================================================
  # SIMULATOR CONTROL UI
  # ==========================================================

  simulator-ui:
    build:
      context: ./simulator-ui

    container_name: lakewatch-simulator-ui

    ports:
      - "8501:8501"

    environment:
      SIMULATOR_URL: http://simulator:9000

    depends_on:
      simulator:
        condition: service_started

  # ==========================================================
  # ADMINER
  # ==========================================================

  adminer:
    image: adminer:latest
    container_name: lakewatch-adminer

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
        


  # ==========================================================
  # MAIN FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend

    container_name: lakewatch-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      backend:
        condition: service_started



# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data: